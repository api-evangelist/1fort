aid: 1fort
name: 1Fort
description: >-
  1Fort is a New York City based insurtech platform that automates the commercial insurance
  workflow for brokers and agencies. Its AI "copilot" autofills submissions across 300+ coverages,
  quotes direct and wholesale markets, generates white-labeled proposals with side-by-side coverage
  comparisons and cross-sell recommendations, then processes binders, invoicing, premium finance,
  payments and payables through to ongoing policy servicing. Coverage lines span cyber, technology
  errors and omissions, professional liability, management liability, general liability and workers
  compensation. The platform runs on AWS, holds SOC 2 Type II, HIPAA and CCPA attestations, and
  exposes a large REST API at api.1fort.com whose Swagger 2.0 definition is published publicly at
  /api-docs — 574 operations across broker, application, quote, market, billing, checkout,
  storefront and Email AI Agent surfaces, plus inbound webhook receivers for Stripe, Ascend,
  Herald, Gmail and Office 365.
