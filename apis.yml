apis:
- name: 1Fort API
  description: >-
    REST API for the 1Fort insurance platform, published as a Swagger 2.0 document generated by
    drf-yasg and served publicly at https://api.1fort.com/api-docs/?format=openapi. 574 operations
    over 451 paths, grouped by app and version — v2 endpoints under /apis/v2/ are the current
    surface, v1 remains documented for compatibility. Covers broker and agency administration,
    clients, applications, coverages, quotes and quote policies, binders, markets and carriers,
    analytics, billing and treasury, premium finance, checkout and storefront, and the Email AI
    Agent / agent runtime surfaces. Authentication is a JWT access token in the Authorization
    header (Bearer or JWT prefix) with an alternative Api-Key scheme; resources are tenant-scoped
    with object-level permissions.
  humanURL: https://api.1fort.com/api-docs
