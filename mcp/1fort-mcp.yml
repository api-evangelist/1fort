blockers_for_a_real_server:
- No self-serve API credential issuance — no developer dashboard or key page was found, so an MCP client
  has no anonymous path to a token.
- No client idempotency key on any operation, which matters more for agent-driven writes than for a human
  console.
- No outbound webhooks, so an MCP server would have to poll for quote and bind status.
