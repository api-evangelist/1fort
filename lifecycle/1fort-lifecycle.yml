versioning:
  scheme: uri-path
  current: v2
  legacy: v1
  base_path: /apis/
  policy_source: openapi info.description
  policy: >-
    "v2 endpoints live under /apis/v2/... and are the current surface. v1 endpoints remain
    documented for compatibility. Endpoints marked deprecated are scheduled for removal;
    prefer the documented replacement."
  note: >-
    Both generations are served concurrently from the same host and are documented in one
    Swagger 2.0 document. There is no version request header and no date-pinned version train.

deprecation:
  policy_url: https://api.1fort.com/api-docs
  policy_published: true
  policy_location: openapi info.description
  mechanism: 'swagger `deprecated: true` on the operation'
  sunset_header: false
  deprecation_header: false
  sunset_dates_published: false
  note: >-
    1Fort marks retiring operations `deprecated: true` in the published Swagger document and
    states in the API description that deprecated endpoints are scheduled for removal. No RFC 8594
    Sunset/Deprecation response headers appear in the spec and no removal dates are published, so
    consumers get a flag but not a timetable.

