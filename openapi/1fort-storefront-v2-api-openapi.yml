components:
  schemas:
    StoreFrontBrokerUserCard:
      type: object
      properties:
        slug:
          title: Slug
          description: URL-safe identifier per agency from the user's name (e.g. ernesto-freyre). Populated automatically when empty.
          type:
          - string
          - 'null'
          format: slug
          pattern: ^[-a-zA-Z0-9_]+$
          maxLength: 255
        first_name:
          title: First name
          type: string
          readOnly: true
          minLength: 1
        last_name:
          title: Last name
          type: string
          readOnly: true
          minLength: 1
        email:
          title: Email
          type: string
          format: email
          readOnly: true
          minLength: 1
        phone_number:
          title: Phone number
          type: string
          readOnly: true
        type:
          title: Type
          description: Specifies the insurance-related role type of the user within the agency.
          type:
          - string
          - 'null'
          enum:
          - LEADERSHIP
          - SALES
          - SERVICE
          - MARKETS
          - OPERATIONS
        storefront_url_slug:
          title: Storefront url slug
          type: string
          readOnly: true
    APIException:
      title: Generic API Error
      required:
      - detail
      type: object
      properties:
        detail:
          description: Error details
          type: string
    CanonicalProductLineRef:
      required:
      - code
      type: object
      properties:
        id:
          title: Id
          type: string
          format: uuid
          readOnly: true
        code:
          title: Code
          type: string
          maxLength: 150
          minLength: 1
        display_name:
          title: Display name
          type:
          - string
          - 'null'
          maxLength: 255
    SupplementaryQuestionsUpdate:
      type: object
      properties:
        user_answers:
          title: User Answers
          description: User-provided answers to supplementary questions keyed by question id
          type: object
    SupplementaryQuestionsRequest:
      required:
      - coverage_application
      type: object
      properties:
        id:
          title: Id
          type: string
          format: uuid
          readOnly: true
        status:
          title: Status
          type: string
          enum:
          - pending
          - in_progress
          - completed
          - failed
        ai_context:
          title: AI Context
          description: The context for the AI to use to generate supplementary questions
          type:
          - object
          - 'null'
        context_hash:
          title: Context Hash
          description: The sha256 hash of the ai_context
          type: string
          maxLength: 64
          minLength: 1
        ai_response:
          title: AI Response
          description: 'List of supplementary questions from the AI: [{id, question, reason, input_type, options}]'
          type:
          - object
          - 'null'
        user_answers:
          title: User Answers
          description: User-provided answers to supplementary questions keyed by question id
          type: object
        start_time:
          title: Start Time
          description: The UTC time the supplementary questions request started
          type:
          - string
          - 'null'
          format: date-time
        end_time:
          title: End Time
          description: The UTC time the supplementary questions request ended
          type:
          - string
          - 'null'
          format: date-time
        error:
          title: Error
          type:
          - string
          - 'null'
        coverage_application:
          title: Coverage Application
          description: The coverage application to generate supplementary questions for
          type: string
          format: uuid
    GenericError:
      title: Generic API Error
      required:
      - detail
      type: object
      properties:
        detail:
          description: Error details
          type: string
    SubProductLine:
      type: object
      properties:
        id:
          title: Id
          type: string
          format: uuid
          readOnly: true
        name:
          title: Name
          type:
          - string
          - 'null'
          maxLength: 255
        display_name:
          title: Display name
          description: Name used on the Frontend.
          type:
          - string
          - 'null'
          maxLength: 255
        description:
          title: Description
          type:
          - string
          - 'null'
        logo:
          title: Logo
          type:
          - string
          - 'null'
          readOnly: true
          format: uri
    ProductLine:
      required:
      - code
      type: object
      properties:
        id:
          title: Id
          type: string
          format: uuid
          readOnly: true
        code:
          title: Code
          type: string
          maxLength: 150
          minLength: 1
        description:
          title: Description
          type:
          - string
          - 'null'
        name:
          title: Name
          type: string
          readOnly: true
        is_core:
          title: Is core
