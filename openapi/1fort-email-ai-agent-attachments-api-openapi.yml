openapi: 3.2.0
info:
  title: 1Fort API Documentation Email AI Agent - Attachments API
  description: '# 1Fort API


    REST API for the 1Fort insurance platform. This document is the authoritative

    map of the API surface; endpoints are grouped in the sidebar by **app** and

    **version**, and large apps are split into per-resource sub-groups.


    ## Authentication


    Almost every endpoint requires a **JWT access token**. Send it in the

    `Authorization` header as either `Bearer <token>` or `JWT <token>`. Tokens may

    also be presented as an HTTP-only cookie. Endpoints documented with no security

    requirement are intentionally public (for example sign-in, OTP and storefront

    endpoints).


    ## Multi-tenancy


    Resources are scoped to a tenant. Nested routes carry the owning resource id in

    the path (for example `/v2/broker/{business_pk}/applications`); a token is only

    authorised for the businesses its user may access. Object-level permissions are

    enforced per endpoint.


    ## Versioning


    `v2` endpoints live under `/apis/v2/...` and are the current surface. `v1`

    endpoints remain documented for compatibility. Endpoints marked **deprecated**

    are scheduled for removal; prefer the documented replacement.

    '
  termsOfService: https://www.1fort.com/
  license:
    name: Privately owned
  version: v1
servers:
- url: https://api.1fort.com/apis/
security:
- Bearer: []
tags:
- name: Email AI Agent - Attachments
  x-displayName: Attachments
  description: '**Access:** requires a JWT access token.'
paths:
  /v2/broker/agent/emails/{email_pk}/attachments/{id}/metadata:
    parameters:
    - name: email_pk
      in: path
      required: true
      schema:
        type: string
    - name: id
      in: path
      description: A UUID string identifying this Email Attachment.
      required: true
      schema:
        type: string
        format: uuid
    put:
      operationId: agent_update_attachment_metadata
      summary: Update Attachment Metadata (Merge)
      description: '

        Update attachment metadata after classification/extraction.


        **Merge semantics**: keys present in the request body overwrite the

        corresponding keys on the row; keys absent from the body are preserved.

        The agent only needs to send the fields it wants to change.


        Use this endpoint to record:

        - Document type classification

        - Processing status

        - Extraction results (insureds found, coverage types)


        **Authentication**: Requires API Key + Session Token


        **Scoping**: Attachment must belong to an email within the session''s broker scope.

        '
      parameters:
      - name: X-Processing-Session
        in: header
        description: Processing session token (scopes access to broker)
        required: true
        schema:
          type: string
      responses:
        '200':
          description: ''
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/AttachmentMetadataUpdateResponse'
        '400':
          description: Validation error
        '401':
          description: Unauthorized - Invalid or missing API key or session token
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
              example:
                error:
                  code: UNAUTHORIZED
                  message: Invalid or missing authentication credentials
        '403':
          description: Forbidden - Resource belongs to unauthorized broker
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
              example:
                error:
                  code: FORBIDDEN
                  message: Access denied - resource outside session scope
        '404':
          description: Not Found - Resource does not exist
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
              example:
                error:
                  code: NOT_FOUND
                  message: Resource not found
        '500':
          description: Internal server error.
      tags:
      - Email AI Agent - Attachments
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/AttachmentMetadataUpdate'
        required: true
    patch:
      operationId: agent_update_attachment_metadata
      summary: Update Attachment Metadata (Merge)
      description: '

        Update attachment metadata after classification/extraction.


        **Merge semantics**: keys present in the request body overwrite the

        corresponding keys on the row; keys absent from the body are preserved.

        The agent only needs to send the fields it wants to change.


        Use this endpoint to record:

        - Document type classification

        - Processing status

        - Extraction results (insureds found, coverage types)


        **Authentication**: Requires API Key + Session Token


        **Scoping**: Attachment must belong to an email within the session''s broker scope.

        '
      parameters:
      - name: X-Processing-Session
        in: header
        description: Processing session token (scopes access to broker)
        required: true
        schema:
          type: string
      responses:
        '200':
          description: ''
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/AttachmentMetadataUpdateResponse'
        '400':
          description: Validation error
        '401':
          description: Unauthorized - Invalid or missing API key or session token
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
              example:
                error:
                  code: UNAUTHORIZED
                  message: Invalid or missing authentication credentials
        '403':
          description: Forbidden - Resource belongs to unauthorized broker
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
              example:
                error:
                  code: FORBIDDEN
                  message: Access denied - resource outside session scope
        '404':
          description: Not Found - Resource does not exist
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
              example:
                error:
                  code: NOT_FOUND
                  message: Resource not found
        '500':
          description: Internal server error.
      tags:
      - Email AI Agent - Attachments
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/AttachmentMetadataUpdate'
        required: true
components:
  schemas:
    AttachmentMetadataUpdate:
      required:
      - processing_status
      - metadata
      type: object
      properties:
        processing_status:
          title: Processing status
          description: 'Processing status (required): UNPROCESSED, QUEUED, PROCESSING, COMPLETED, FAILED, SKIPPED.'
          type: string
          enum:
          - UNPROCESSED
          - QUEUED
          - PROCESSING
          - COMPLETED
          - FAILED
          - SKIPPED
        metadata:
          title: Metadata
          description: 'Fields to merge into existing metadata (per-key upsert). Common fields: document_type, document_year, coverage_types, insurance_context, extracted, potential_insureds_count.'
          type: object
          additionalProperties:
            type:
            - string
            - 'null'
    AttachmentMetadataUpdateResponse:
      type: object
      properties:
        id:
          title: Id
          type: string
          format: uuid
          readOnly: true
        email_id:
          title: Email id
          type: string
          format: uuid
          readOnly: true
        name:
          title: Name
          type: string
          readOnly: true
          minLength: 1
        processing_status:
          title: Processing status
          type: string
          readOnly: true
          minLength: 1
        document_type:
          title: Document type
          type:
          - string
          - 'null'
          readOnly: true
          minLength: 1
        metadata:
          title: Metadata
          type: object
          additionalProperties:
            type:
            - string
            - 'null'
          readOnly: true
        updated_at:
          title: Updated at
          type: string
          format: date-time
          readOnly: true
    ErrorResponse:
      required:
      - error
      type: object
      properties:
        error:
          title: Error
          description: Error details with code and message.
          type: object
          additionalProperties:
            type: string
            minLength: 1
        request_id:
          title: Request id
          description: Request ID for debugging.
          type: string
          minLength: 1
        timestamp:
          title: Timestamp
          description: When the error occurred.
          type: string
          format: date-time
  securitySchemes:
    Bearer:
      type: apiKey
      name: Authorization
      in: header
      description: JWT access token. Send as `Bearer <token>` or `JWT <token>`.
    ApiKey:
      type: apiKey
      name: Authorization
      in: header
      description: API key. Send as `Api-Key <key>`.
