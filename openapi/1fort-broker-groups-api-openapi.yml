openapi: 3.2.0
info:
  title: 1Fort API Documentation Broker Groups API
  description: '# 1Fort API


    REST API for the 1Fort insurance platform. This document is the authoritative

    map of the API surface; endpoints are grouped in the sidebar by **app** and

    **version**, and large apps are split into per-resource sub-groups.


    ## Authentication


    Almost every endpoint requires a **JWT access token**. Send it in the

    `Authorization` header as either `Bearer <token>` or `JWT <token>`. Tokens may

    also be presented as an HTTP-only cookie. Endpoints documented with no security

    requirement are intentionally public (for example sign-in, OTP and storefront

    endpoints).


    ## Multi-tenancy


    Resources are scoped to a tenant. Nested routes carry the owning resource id in

    the path (for example `/v2/broker/{business_pk}/applications`); a token is only

    authorised for the businesses its user may access. Object-level permissions are

    enforced per endpoint.


    ## Versioning


    `v2` endpoints live under `/apis/v2/...` and are the current surface. `v1`

    endpoints remain documented for compatibility. Endpoints marked **deprecated**

    are scheduled for removal; prefer the documented replacement.

    '
  termsOfService: https://www.1fort.com/
  license:
    name: Privately owned
  version: v1
servers:
- url: https://api.1fort.com/apis/
security:
- Bearer: []
tags:
- name: broker_groups
  x-displayName: Groups
  description: '**Access:** requires a JWT access token.'
paths:
  /broker/{broker_pk}/groups:
    parameters:
    - name: broker_pk
      in: path
      required: true
      schema:
        type: string
    get:
      operationId: broker_groups_list
      summary: List Broker User Groups
      description: '

        List all broker user groups.

        Returns groups with member count for each group.

        '
      parameters:
      - name: ordering
        in: query
        description: Which field to use when ordering the results.
        required: false
        schema:
          type: string
      - name: search
        in: query
        description: A search term.
        required: false
        schema:
          type: string
      - name: limit
        in: query
        description: Number of results to return per page.
        required: false
        schema:
          type: integer
      - name: offset
        in: query
        description: The initial index from which to return the results.
        required: false
        schema:
          type: integer
      responses:
        '200':
          description: ''
          content:
            application/json:
              schema:
                required:
                - count
                - results
                type: object
                properties:
                  count:
                    type: integer
                  next:
                    type:
                    - string
                    - 'null'
                    format: uri
                  previous:
                    type:
                    - string
                    - 'null'
                    format: uri
                  results:
                    type: array
                    items:
                      $ref: '#/components/schemas/BrokerUserGroupList'
        '403':
          description: Authentication credentials were invalid, absent or insufficient.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/GenericError'
        '500':
          description: Internal server error.
      tags:
      - broker_groups
    post:
      operationId: broker_groups_create
      summary: Create Broker User Group
      description: '

        Create a new broker user group.

        '
      responses:
        '201':
          description: ''
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/BrokerUserGroupCreateUpdate'
        '400':
          description: Invalid input.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ValidationError'
        '403':
          description: Authentication credentials were invalid, absent or insufficient.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/GenericError'
        '500':
          description: Internal server error.
      tags:
      - broker_groups
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/BrokerUserGroupCreateUpdate'
        required: true
  /broker/{broker_pk}/groups/{group_pk}/members:
    parameters:
    - name: broker_pk
      in: path
      required: true
      schema:
        type: string
    - name: group_pk
      in: path
      required: true
      schema:
        type: string
    get:
      operationId: broker_groups_members_list
      summary: List Group Memberships
      description: '

        List all memberships for a specific broker user group.

        '
      parameters:
      - name: ordering
        in: query
        description: Which field to use when ordering the results.
        required: false
        schema:
          type: string
      - name: search
        in: query
        description: A search term.
        required: false
        schema:
          type: string
      - name: limit
        in: query
        description: Number of results to return per page.
        required: false
        schema:
          type: integer
      - name: offset
        in: query
        description: The initial index from which to return the results.
        required: false
        schema:
          type: integer
      responses:
        '200':
          description: ''
          content:
            application/json:
              schema:
                required:
                - count
                - results
                type: object
                properties:
                  count:
                    type: integer
                  next:
                    type:
                    - string
                    - 'null'
                    format: uri
                  previous:
                    type:
                    - string
                    - 'null'
                    format: uri
                  results:
                    type: array
                    items:
                      $ref: '#/components/schemas/BrokerUserGroupMembershipList'
        '403':
          description: Authentication credentials were invalid, absent or insufficient.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/GenericError'
        '500':
          description: Internal server error.
      tags:
      - broker_groups
    post:
      operationId: broker_groups_members_create
      summary: Add User to Group
      description: '

        Add a broker user to a group.

        Note: Each user can only have one active group membership at a time.

        '
      responses:
        '201':
          description: ''
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/BrokerUserGroupMembershipCreate'
        '400':
          description: Invalid input.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ValidationError'
        '403':
          description: Authentication credentials were invalid, absent or insufficient.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/GenericError'
        '500':
          description: Internal server error.
      tags:
      - broker_groups
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/BrokerUserGroupMembershipCreate'
        required: true
  /broker/{broker_pk}/groups/{group_pk}/members/{id}:
    parameters:
    - name: broker_pk
      in: path
      required: true
      schema:
        type: string
    - name: group_pk
      in: path
      required: true
      schema:
        type: string
    - name: id
      in: path
      required: true
      schema:
        type: string
    delete:
      operationId: broker_groups_members_delete
      summary: Remove User from Group
      description: '

        Remove a broker user from a group by deleting the membership.

        '
      responses:
        '204':
          description: ''
        '403':
          description: Authentication credentials were invalid, absent or insufficient.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/GenericError'
        '404':
          description: Object does not exist or caller has insufficient permissions to access it.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/APIException'
        '500':
          description: Internal server error.
      tags:
      - broker_groups
  /broker/{broker_pk}/groups/{id}:
    parameters:
    - name: broker_pk
      in: path
      required: true
      schema:
        type: string
    - name: id
      in: path
      required: true
      schema:
        type: string
    get:
      operationId: broker_groups_read
      summary: Get Broker User Group
      description: '

        Get detailed information about a specific broker user group.

        '
      responses:
        '200':
          description: ''
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/BrokerUserGroupDetail'
        '403':
          description: Authentication credentials were invalid, absent or insufficient.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/GenericError'
        '404':
          description: Object does not exist or caller has insufficient permissions to access it.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/APIException'
        '500':
          description: Internal server error.
      tags:
      - broker_groups
    put:
      operationId: broker_groups_update
      summary: Update Broker User Group
      description: '

        Update a broker user group.

        '
      responses:
        '200':
          description: ''
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/BrokerUserGroupCreateUpdate'
        '400':
          description: Invalid input.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ValidationError'
        '403':
          description: Authentication credentials were invalid, absent or insufficient.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/GenericError'
        '404':
          description: Object does not exist or caller has insufficient permissions to access it.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/APIException'
        '500':
          description: Internal server error.
      tags:
      - broker_groups
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/BrokerUserGroupCreateUpdate'
        required: true
    patch:
      operationId: broker_groups_partial_update
      summary: Partially Update Broker User Group
      description: '

        Partially update a broker user group.

        '
      responses:
        '200':
          description: ''
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/BrokerUserGroupCreateUpdate'
        '400':
          description: Invalid input.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ValidationError'
        '403':
          description: Authentication credentials were invalid, absent or insufficient.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/GenericError'
        '404':
          description: Object does not exist or caller has insufficient permissions to access it.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/APIException'
        '500':
          description: Internal server error.
      tags:
      - broker_groups
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/BrokerUserGroupCreateUpdate'
        required: true
    delete:
      operationId: broker_groups_delete
      summary: Delete Broker User Group
      description: '

        Delete a broker user group. Only groups without members can be deleted.

        '
      responses:
        '204':
          description: ''
        '403':
          description: Authentication credentials were invalid, absent or insufficient.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/GenericError'
        '404':
          description: Object does not exist or caller has insufficient permissions to access it.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/APIException'
        '500':
          description: Internal server error.
      tags:
      - broker_groups
components:
  schemas:
    APIException:
      title: Generic API Error
      required:
      - detail
      type: object
      properties:
        detail:
          description: Error details
          type: string
    BrokerUserGroupMembershipCreate:
      required:
      - broker_user
      type: object
      properties:
        broker_user:
          title: Broker user
          description: The broker user who is a member of the group
          type: integer
        is_active:
          title: Is active
          description: Whether this membership is currently active
          type: boolean
    GenericError:
      title: Generic API Error
      required:
      - detail
      type: object
      properties:
        detail:
          description: Error details
          type: string
    BrokerUserGroupList:
      required:
      - name
      type: object
      properties:
        id:
          title: Id
          type: string
          format: uuid
          readOnly: true
        name:
          title: Name
          description: Name of the broker user group
          type: string
          maxLength: 255
          minLength: 1
        domain:
          title: Domain
          description: Domain name associated with this group
          type:
          - string
          - 'null'
          maxLength: 500
        agency:
          title: Agency
          description: The agency this group belongs to
          type:
          - integer
          - 'null'
          readOnly: true
        agency_name:
          title: Agency name
          type: string
          readOnly: true
          minLength: 1
        address:
          title: Address
          description: Full address of the group
          type:
          - string
          - 'null'
        npn_number:
          title: Npn number
          description: National Producer Number (NPN) for this group
          type:
          - string
          - 'null'
          maxLength: 50
        phone_number:
          title: Phone number
          description: Primary phone number for the group
          type:
          - string
          - 'null'
          maxLength: 255
        office_phone_number:
          title: Office phone number
          description: Office phone number for the group
          type:
          - string
          - 'null'
          maxLength: 255
        accounting_email:
          description: List of accounting email addresses for this group
          type:
          - array
          - 'null'
          items:
            title: Accounting email
            type: string
            format: email
            maxLength: 254
            minLength: 1
        logo:
          title: Logo
          description: Logo for this broker user group
          type:
          - string
          - 'null'
          readOnly: true
          format: uri
        member_count:
          title: Member count
          type: string
          readOnly: true
        created_at:
          title: Created at
          type: string
          format: date-time
          readOnly: true
        updated_at:
          title: Updated at
          type: string
          format: date-time
          readOnly: true
    BrokerUserGroupCreateUpdate:
      required:
      - name
      type: object
      properties:
        name:
          title: Name
          description: Name of the broker user group
          type: string
          maxLength: 255
          minLength: 1
        domain:
          title: Domain
          description: Domain name associated with this group
          type:
          - string
          - 'null'
          maxLength: 500
        address:
          title: Address
          description: Full address of the group
          type:
          - string
          - 'null'
        npn_number:
          title: Npn number
          description: National Producer Number (NPN) for this group
          type:
          - string
          - 'null'
          maxLength: 50
        phone_number:
          title: Phone number
          description: Primary phone number for the group
          type:
          - string
          - 'null'
          maxLength: 255
        office_phone_number:
          title: Office phone number
          description: Office phone number for the group
          type:
          - string
          - 'null'
          maxLength: 255
        accounting_email:
          description: List of accounting email addresses for this group
          type:
          - array
          - 'null'
          items:
            title: Accounting email
            type: string
            format: email
            maxLength: 254
            minLength: 1
        logo:
          title: Logo
          description: Logo for this broker user group
          type:
          - string
          - 'null'
          readOnly: true
          format: uri
    ValidationError:
      title: Validation Error
      type: object
      properties:
        non_field_errors:
          description: List of validation errors not related to any field
          type: array
          items:
            type: string
      additionalProperties:
        description: A list of error messages for each field that triggered a validation error
        type: array
        items:
          type: string
    BrokerUserGroupDetail:
      required:
