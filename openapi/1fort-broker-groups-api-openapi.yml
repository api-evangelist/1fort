          - 'null'
          maxLength: 500
        agency:
          title: Agency
          description: The agency this group belongs to
          type:
          - integer
          - 'null'
          readOnly: true
        agency_name:
          title: Agency name
          type: string
          readOnly: true
          minLength: 1
        address:
          title: Address
          description: Full address of the group
          type:
          - string
          - 'null'
        npn_number:
          title: Npn number
          description: National Producer Number (NPN) for this group
          type:
          - string
          - 'null'
          maxLength: 50
        phone_number:
          title: Phone number
          description: Primary phone number for the group
          type:
          - string
          - 'null'
          maxLength: 255
        office_phone_number:
          title: Office phone number
          description: Office phone number for the group
          type:
          - string
          - 'null'
          maxLength: 255
        accounting_email:
          description: List of accounting email addresses for this group
          type:
          - array
          - 'null'
          items:
            title: Accounting email
            type: string
            format: email
            maxLength: 254
            minLength: 1
        logo:
          title: Logo
          description: Logo for this broker user group
          type:
          - string
          - 'null'
          readOnly: true
          format: uri
        member_count:
          title: Member count
          type: string
          readOnly: true
        created_at:
          title: Created at
          type: string
          format: date-time
          readOnly: true
        updated_at:
          title: Updated at
          type: string
          format: date-time
          readOnly: true
    BrokerUserGroupMembershipList:
      required:
      - broker_user
      - group
      type: object
      properties:
        id:
          title: Id
          type: string
          format: uuid
          readOnly: true
        broker_user:
          title: Broker user
          description: The broker user who is a member of the group
          type: integer
        broker_user_email:
          title: Broker user email
          type: string
          readOnly: true
          minLength: 1
        broker_user_name:
          title: Broker user name
          type: string
          readOnly: true
        group:
          title: Group
          description: The group the broker user belongs to
          type: string
          format: uuid
        group_name:
          title: Group name
          type: string
          readOnly: true
          minLength: 1
        is_active:
          title: Is active
          description: Whether this membership is currently active
          type: boolean
        created_at:
          title: Created at
          type: string
          format: date-time
          readOnly: true
        updated_at:
          title: Updated at
          type: string
          format: date-time
          readOnly: true
  securitySchemes:
    Bearer:
      type: apiKey
      name: Authorization
      in: header
      description: JWT access token. Send as `Bearer <token>` or `JWT <token>`.
    ApiKey:
      type: apiKey
      name: Authorization
      in: header
      description: API key. Send as `Api-Key <key>`.
