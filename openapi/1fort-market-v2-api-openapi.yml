          description: Username for the portal
          type:
          - string
          - 'null'
          maxLength: 255
        portal_password:
          title: Portal password
          description: Password for the portal
          type:
          - string
          - 'null'
          maxLength: 255
        has_portal_password:
          title: Has portal password
          description: Indicates if a portal password is stored
          type: boolean
          readOnly: true
        is_platform_market:
          title: Is platform market
          type: boolean
          readOnly: true
        is_broker_market:
          title: Is broker market
          type: boolean
          readOnly: true
        supports_herald:
          title: Supports herald
          type: boolean
          readOnly: true
        created_at:
          title: Created at
