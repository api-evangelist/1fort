components:
  schemas:
    APIException:
      title: Generic API Error
      required:
      - detail
      type: object
      properties:
        detail:
          description: Error details
          type: string
    QuoteTaskFlexFields:
      required:
      - title
      - group
      - quote
      - business
      - broker
      type: object
      properties:
        id:
          title: Id
          type: string
          format: uuid
          readOnly: true
        documents:
          type: array
          items:
            $ref: '#/components/schemas/QuoteTaskDocument'
          readOnly: true
        status_display:
          title: Status display
          type: string
          readOnly: true
          minLength: 1
        type_display:
          title: Type display
          type: string
          readOnly: true
          minLength: 1
        program_url:
          title: Program url
          type: string
          readOnly: true
        invoice_url:
          title: Invoice url
          type: string
          readOnly: true
        quote_ids:
          type: array
          items:
            type: string
            format: uuid
          uniqueItems: true
        created_at:
          title: Created at
          type: string
          format: date-time
          readOnly: true
        title:
          title: Title
          type: string
          minLength: 1
        description:
          title: Description
          type:
          - string
          - 'null'
        status:
          title: Status
          type: string
          enum:
          - todo
          - done
          - dismissed
          - n/a
        type:
          title: Type
          type:
          - string
          - 'null'
          enum:
          - signature
          - subjectivities
          - clarifications
          - payment
        due_date:
          title: Due date
          type:
          - string
          - 'null'
          format: date
        completed_date:
          title: Completed date
          type:
          - string
          - 'null'
          format: date
        resolution_comment:
          title: Resolution comment
          type:
          - string
          - 'null'
        visible_to_business:
          title: Visible to business
          description: Flag to indicate if this task is visible to the business
          type: boolean
        expired:
          title: Expired
          description: Flag to indicate if this task has expired
          type: boolean
        group:
          title: Group
          type: string
          format: uuid
        quote:
          title: Quote
          type: string
          format: uuid
        business:
          title: Business
          type: integer
        broker:
          title: Broker
          type: integer
        completed_by:
          title: Completed by
          type:
          - integer
          - 'null'
    GenericError:
      title: Generic API Error
      required:
      - detail
      type: object
      properties:
        detail:
          description: Error details
          type: string
    ValidationError:
      title: Validation Error
      type: object
      properties:
        non_field_errors:
          description: List of validation errors not related to any field
          type: array
          items:
            type: string
      additionalProperties:
        description: A list of error messages for each field that triggered a validation error
        type: array
        items:
          type: string
    QuoteTaskResolve:
      required:
      - id
      type: object
      properties:
        id:
          title: Id
          type: string
          format: uuid
        status:
          title: Status
          type: string
          enum:
          - todo
          - done
          - dismissed
          - n/a
        resolution_comment:
          title: Resolution comment
          type: string
        quote_ids:
          type: array
          items:
            type: string
            format: uuid
          uniqueItems: true
        document_files:
          type: array
          items:
            type: string
            readOnly: true
            format: uri
        document_names:
          type: array
          items:
            type: string
        documents:
          type: array
          items:
            $ref: '#/components/schemas/QuoteTaskDocument'
          readOnly: true
    QuoteTaskDocument:
      type: object
      properties:
        id:
          title: Id
          type: string
          format: uuid
          readOnly: true
        name:
          title: Name
          type:
          - string
          - 'null'
          maxLength: 255
        document:
          title: Document
          type:
          - string
          - 'null'
          readOnly: true
          format: uri
    QuoteTaskBulkResolve:
      required:
      - tasks
      type: object
      properties:
        tasks:
          type: array
          items:
            $ref: '#/components/schemas/QuoteTaskResolve'
  securitySchemes:
    Bearer:
      type: apiKey
      name: Authorization
      in: header
      description: JWT access token. Send as `Bearer <token>` or `JWT <token>`.
    ApiKey:
      type: apiKey
      name: Authorization
      in: header
      description: API key. Send as `Api-Key <key>`.
