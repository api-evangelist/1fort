          type: string
    BusinessAccessRole:
      required:
      - name
      type: object
      properties:
        id:
          title: ID
          type: integer
          readOnly: true
        name:
          title: Name
          type: string
          maxLength: 255
          minLength: 1
        permissions:
          type: array
          items:
            type: string
          uniqueItems: true
        description:
          title: Description
          type:
          - string
          - 'null'
        created_at:
          title: Created at
          type: string
          format: date-time
          readOnly: true
        created_by:
          title: Created by
          type:
          - integer
          - 'null'
    GenericError:
      title: Generic API Error
      required:
