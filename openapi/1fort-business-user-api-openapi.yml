          - other
        permissions:
          type: array
          items:
            type: string
          uniqueItems: true
        created_at:
          title: Created at
          type: string
          format: date-time
          readOnly: true
        updated_at:
          title: Updated at
          type: string
          format: date-time
          readOnly: true
        created_by:
          title: Created by
          type:
          - integer
          - 'null'
    BusinessGroup:
      required:
      - name
      - business
      type: object
      properties:
        id:
          title: ID
          type: integer
          readOnly: true
        name:
          title: Name
          type: string
          minLength: 1
        user_count:
          title: User count
          type: string
          readOnly: true
        permissions:
          type: array
          items:
            type: string
          uniqueItems: true
        created_at:
          title: Created at
          type: string
          format: date-time
          readOnly: true
        updated_at:
          title: Updated at
          type: string
          format: date-time
          readOnly: true
        deleted_at:
          title: Deleted at
          type:
          - string
          - 'null'
          format: date-time
        business:
          title: Business
          type: integer
        created_by:
          title: Created by
          type:
          - integer
          - 'null'
  securitySchemes:
    Bearer:
      type: apiKey
      name: Authorization
      in: header
      description: JWT access token. Send as `Bearer <token>` or `JWT <token>`.
    ApiKey:
      type: apiKey
      name: Authorization
      in: header
      description: API key. Send as `Api-Key <key>`.
