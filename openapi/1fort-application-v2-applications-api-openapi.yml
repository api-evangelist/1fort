  /v2/broker/{business_pk}/applications/{id}/copy:
    parameters:
    - name: business_pk
      in: path
      required: true
      schema:
        type: string
    - name: id
      in: path
      description: A UUID string identifying this Application.
      required: true
      schema:
        type: string
        format: uuid
    post:
      operationId: v2_broker_applications_copy_application
      summary: Copy Application
      description: '

        Create a copy of an existing application with optional field overrides.


        This endpoint allows you to create a copy of an existing application while optionally

        overriding specific fields in the new application. The copy will maintain all the

        original application''s data and relationships except for the fields that are explicitly

        overridden.


        When copying an excess application:

        - If new primary_quote_files are provided, they will be used for the new application

        - If no new files are provided, the original files will be copied

        - primary_quote_files are required if coverage_layer is set to ''excess''


        For ML (Management Liability) applications:

        - You can override sub_coverage_types to change the specific coverage types

        - If sub_coverage_types is not provided, the original sub coverage types will be copied

        '
      responses:
        '201':
          description: ''
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ApplicationV2'
        '400':
          description: Invalid input.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ValidationError'
        '403':
          description: Authentication credentials were invalid, absent or insufficient.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/GenericError'
        '404':
          description: Object does not exist or caller has insufficient permissions to access it.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/APIException'
        '500':
          description: Internal server error.
      tags:
      - 'application (v2): applications'
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/ApplicationCopyOverride'
        required: true
