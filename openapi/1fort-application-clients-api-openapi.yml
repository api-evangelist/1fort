      type: object
      properties:
        id:
          title: Id
          type: string
          format: uuid
          readOnly: true
        carriers:
          type: array
          items:
            type: string
          uniqueItems: true
        selected_markets:
          type: array
          items:
            type: string
            format: uuid
          uniqueItems: true
        is_active:
          title: Is active
          type: boolean
          readOnly: true
        business:
          $ref: '#/components/schemas/BusinessList'
        created_by:
          $ref: '#/components/schemas/BrokerUserList'
        brokerage_direct_placement_carriers:
          type: array
          items:
            type: string
            format: uuid
          uniqueItems: true
        carriers_1fort_should_not_approach:
          type: array
          items:
            type: string
            format: uuid
          uniqueItems: true
        created_at:
          title: Created at
          type: string
          format: date-time
          readOnly: true
        name:
          title: Name
          type:
          - string
          - 'null'
          maxLength: 255
        description:
          title: Description
          type:
          - string
          - 'null'
        effective_date:
          title: Effective date
          type:
          - string
          - 'null'
          format: date
        due_date:
          title: Due date
          type:
          - string
          - 'null'
          format: date
        policy_type:
