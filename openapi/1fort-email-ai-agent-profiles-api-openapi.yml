          description: Company/insured name.
          type: string
          minLength: 1
        dbas:
          description: Alternative business names (DBA).
          type: array
          items:
            type: string
            minLength: 1
          default: []
        domains:
          description: Company domain names.
          type: array
          items:
            type: string
            minLength: 1
          default: []
        emails:
          description: Contact email addresses.
          type: array
          items:
            type: string
            format: email
            minLength: 1
          default: []
        phone_numbers:
          description: Contact phone numbers.
          type: array
          items:
            type: string
            minLength: 1
          default: []
        addresses:
          description: Business addresses.
          type: array
          items:
            $ref: '#/components/schemas/AgentAddress'
          default: []
        people:
          description: Contact people.
          type: array
          items:
            $ref: '#/components/schemas/AgentPerson'
          default: []
        ein:
          title: Ein
          description: EIN number.
          type: string
        fein:
          title: Fein
          description: Federal EIN number.
          type: string
        industry_classification:
          title: Industry classification
          description: Industry classification.
          type: string
        employee_count:
          title: Employee count
          description: Number of employees.
          type:
          - integer
          - 'null'
        annual_revenue:
          title: Annual revenue
          description: Annual revenue in USD.
          type:
          - integer
          - 'null'
        insurance_context:
          title: Insurance context
          description: Insurance context type.
          type: string
          enum:
          - COMMERCIAL_INSURANCE
          - PERSONAL_INSURANCE
          default: COMMERCIAL_INSURANCE
        source_documents:
          description: Documents this profile was extracted from.
          type: array
          items:
            $ref: '#/components/schemas/AgentSourceDocument'
          default: []
    AgentProfileCreateBusiness:
      type: object
      properties:
        name:
          title: Name
          description: Override business name (defaults to profile's insured name).
          type: string
          minLength: 1
        domain_name:
          title: Domain name
          description: Override domain (defaults to first domain in profile).
          type: string
          minLength: 1
        assign_agent_from_email:
          title: Assign agent from email
          description: Assign business to agent from source email's user.
          type: boolean
          default: true
        confirmed_duplicate_reviewed:
          title: Confirmed duplicate reviewed
          description: Set true only after reviewing every candidate from a 409 duplicate_candidates response and concluding none is the same company. Requires duplicate_review_reason.
          type: boolean
          default: false
        duplicate_review_reason:
          title: Duplicate review reason
          description: Why the closest candidate is a different company (recorded for audit). Required with confirmed_duplicate_reviewed.
          type: string
          minLength: 1
    AgentProfileLinkEmail:
      type: object
      properties:
        email_id:
          title: Email id
          description: Email ID to link.
          type:
          - string
          - 'null'
          format: uuid
        attachment_ids:
          description: List of attachment IDs to link.
          type: array
          items:
            type: string
            format: uuid
          default: []
    AgentBusinessCandidate:
      type: object
      properties:
        business_id:
          title: Business id
          type: string
          format: uuid
          readOnly: true
        business_name:
          title: Business name
          type: string
          readOnly: true
          minLength: 1
        domain_name:
          title: Domain name
          type:
          - string
          - 'null'
          readOnly: true
          minLength: 1
        score:
          title: Score
          description: Confidence score in [0, 1] aggregated across matched signals; candidates are returned ranked best-first.
          type: number
          readOnly: true
        match_reasons:
          description: 'Signals that matched: domain_match, name_exact, business_user_email, parameter_value, fuzzy_search.'
          type: array
          items:
            type: string
            minLength: 1
          readOnly: true
        conflicts:
          description: 'Reasons to pause before linking: archived_business, generic_domain_only.'
          type: array
          items:
            type: string
            minLength: 1
          readOnly: true
        match_details:
          title: Match details
          description: 'Details about what matched: matched_name, matched_emails, matched_domain, matched_normalized_domain, matched_parameters, fuzzy_score.'
          type: object
          additionalProperties:
            type:
            - string
            - 'null'
          readOnly: true
    AgentProfileLinkedAttachment:
      type: object
      properties:
        id:
          title: Id
          type: string
          format: uuid
          readOnly: true
        name:
          title: Name
          type:
          - string
          - 'null'
          readOnly: true
          minLength: 1
        email_id:
          title: Email id
          type: string
          format: uuid
          readOnly: true
  securitySchemes:
    Bearer:
      type: apiKey
      name: Authorization
      in: header
      description: JWT access token. Send as `Bearer <token>` or `JWT <token>`.
    ApiKey:
      type: apiKey
      name: Authorization
      in: header
      description: API key. Send as `Api-Key <key>`.
