          title: Role
          type: string
        email:
          title: Email
          type: string
          format: email
        phone:
          title: Phone
          type: string
    AgentProfileLinkedEmail:
      type: object
      properties:
        id:
          title: Id
          type: string
          format: uuid
          readOnly: true
        subject:
          title: Subject
          type:
          - string
          - 'null'
          readOnly: true
          minLength: 1
        received_at:
          title: Received at
          type:
          - string
          - 'null'
          format: date-time
          readOnly: true
