          format: uuid
    AgentProfileLinkEmailResponse:
      type: object
      properties:
        id:
          title: Id
          type: string
          format: uuid
          readOnly: true
        linked_emails_count:
          title: Linked emails count
          type: integer
          readOnly: true
        linked_attachments_count:
          title: Linked attachments count
          type: integer
          readOnly: true
        newly_linked:
          title: Newly linked
          type: object
          additionalProperties:
            type:
            - string
            - 'null'
          readOnly: true
    AgentProfileLinkBusinessResponse:
      type: object
      properties:
        id:
          title: Id
          type: string
          format: uuid
          readOnly: true
        business_id:
          title: Business id
          type: string
          format: uuid
