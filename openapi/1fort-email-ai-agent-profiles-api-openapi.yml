          readOnly: true
        profile_linked:
          title: Profile linked
          type: boolean
          readOnly: true
        agent_assigned:
          title: Agent assigned
          type: boolean
          readOnly: true
        agent_id:
          title: Agent id
          type:
          - string
          - 'null'
          format: uuid
          readOnly: true
