          type: array
          items:
            $ref: '#/components/schemas/AgentProfileLinkedEmail'
          readOnly: true
        linked_attachments:
          type: array
          items:
            $ref: '#/components/schemas/AgentProfileLinkedAttachment'
          readOnly: true
        created_at:
          title: Created at
          type: string
          format: date-time
          readOnly: true
        updated_at:
          title: Updated at
