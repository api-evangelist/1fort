components:
  schemas:
    AgentProfileUpsertResponse:
      type: object
      properties:
        id:
          title: Id
          description: Profile ID (opensearch_profile_id).
          type: string
          readOnly: true
          minLength: 1
        insured:
          title: Insured
          type: string
          readOnly: true
          minLength: 1
        created:
          title: Created
          description: True if new profile was created, False if existing was updated.
          type: boolean
          readOnly: true
        business:
          $ref: '#/components/schemas/AgentProfileBusiness'
    AgentProfileBusiness:
      type: object
      properties:
        id:
          title: Id
          type: string
          format: uuid
          readOnly: true
        name:
          title: Name
          type: string
          readOnly: true
          minLength: 1
        domain_name:
          title: Domain name
          type:
          - string
          - 'null'
          readOnly: true
          minLength: 1
    APIException:
      title: Generic API Error
      required:
      - detail
      type: object
      properties:
        detail:
          description: Error details
          type: string
    AgentAddress:
      type: object
      properties:
        street:
          title: Street
          type: string
        city:
          title: City
          type: string
        state:
          title: State
          type: string
        zip:
          title: Zip
          type: string
        postal_code:
          title: Postal code
          type: string
        country:
          title: Country
          type: string
        full_address:
          title: Full address
          type: string
    ErrorResponse:
      required:
      - error
      type: object
      properties:
        error:
          title: Error
          description: Error details with code and message.
