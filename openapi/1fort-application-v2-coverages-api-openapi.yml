components:
  schemas:
    BrokerCoverageApplicationWithCompositeResponse:
      required:
      - coverage_type
      - application
      type: object
      properties:
        id:
          title: Id
          type: string
          format: uuid
          readOnly: true
        name:
          title: Name
          type: string
          readOnly: true
          minLength: 1
        coverage_type:
          $ref: '#/components/schemas/ProductLine'
        sub_coverage_types:
          type: array
          items:
            type: string
            format: uuid
          uniqueItems: true
        status:
          title: Status
          type: string
          enum:
          - in_progress
          - generating_questions
          - pending_business_info
          - needs_review
          - submitted
          - archived
        status_display:
          title: Status display
          type: string
          readOnly: true
          minLength: 1
        application:
          title: Application
          type: string
          format: uuid
        raw_question_values:
          title: Raw question values
          type:
          - object
          - 'null'
        policy_type:
          title: Policy type
          type: string
          enum:
          - ADMITTED
          - SURPLUS_LINES
          - ADMITTED_AND_SURPLUS_LINES
        policy_type_display:
          title: Policy type display
          type: string
          readOnly: true
          minLength: 1
        additional_notes:
